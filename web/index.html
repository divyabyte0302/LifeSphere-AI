<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="LifeSphere AI brings together your authorized health, lifestyle, wearable and environmental information into a continuously updated personal health profile.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LifeSphere AI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>LifeSphere AI - Health & Environmental Intelligence</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #020617;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    #loading-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #94a3b8;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(16, 185, 129, 0.15);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-indicator">
    <div class="spinner"></div>
    <div style="font-weight: 600; color: #f8fafc; font-size: 16px; letter-spacing: -0.5px;">LIFESPHERE <span style="color: #34d399;">AI</span></div>
    <div style="font-size: 12px; margin-top: 4px; color: #64748b;">Initializing Health Intelligence Engine...</div>
  </div>

  <script src="flutter.js" defer></script>
  <script>
    window.addEventListener('load', function(ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: {{flutter_service_worker_version}},
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            const loader = document.getElementById('loading-indicator');
            if (loader) loader.remove();
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
