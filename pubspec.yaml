name: lifesphere_ai
description: "LifeSphere AI - Personal Health & Environmental Intelligence Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Material 3 & UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  # State Management
  provider: ^6.1.1
  # Networking & APIs
  http: ^1.2.0
  dio: ^5.4.0
  # Persistence & Storage
  shared_preferences: ^2.2.2
  # Charts & Visualization
  fl_chart: ^0.66.0
  # Internationalization & Utils
  intl: ^0.19.0
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
